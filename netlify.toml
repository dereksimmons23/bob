[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Edge function for dynamic OG tags on shared content
[[edge_functions]]
  function = "og-tags"
  path = "/b/*"

[[edge_functions]]
  function = "og-tags"
  path = "/v/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
